<style>
/* Layout: app shell (max 560px) with a dark floating bottom bar and a centre "+" button, like the reference screens.
   Warm off-white ground, white cards with big radii, pastel category tiles from the Paola Lozano Studio palette. */
:root {
  --bg: #F3F0EA;
  --card: #FFFFFF;
  --ink: #1F1B1A;
  --muted: #7C746E;
  --line: #E9E4DC;
  --chip: #F3F0EA;
  --bar: #1F1B1A;
  --on-bar: #F3F0EA;
  --sun: #F7B928;
  --peach: #F6C2AC;
  --sky: #C6D8F2;
  --lav: #DAD2F6;
  --sage: #B7C97C;
  --pink: #F4C3CC;
  --earth: #A65430;
  --cocoa: #6E4436;
  --red: #C2412D;
  --on-pastel: #1F1B1A;
  --font: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
  --hand: "Caveat", "Segoe Print", cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141211; --card: #1F1C1A; --ink: #F3EFE8; --muted: #A69E97; --line: #2F2B28; --chip: #2A2624;
    --bar: #2A2624; --on-bar: #F3EFE8; --earth: #E08A5E; --cocoa: #C99A86; --red: #F07A66;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141211; --card: #1F1C1A; --ink: #F3EFE8; --muted: #A69E97; --line: #2F2B28; --chip: #2A2624;
  --bar: #2A2624; --on-bar: #F3EFE8; --earth: #E08A5E; --cocoa: #C99A86; --red: #F07A66;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
.app {
  max-width: 560px; margin: 0 auto;
  padding-top: 24px;
  padding-bottom: calc(120px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 28px;
}
h1, h2, h3 { margin: 0; font-weight: 600; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 34px; line-height: 1.1; }
h2 { font-size: 22px; line-height: 1.2; }
h3 { font-size: 17px; line-height: 1.25; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }
.hand { font-family: var(--hand); }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: none; padding: 0; }
:focus-visible { outline: 2px solid var(--earth); outline-offset: 2px; }
section { display: flex; flex-direction: column; gap: 14px; }
.shead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.see { font-size: 14px; color: var(--muted); }
.see:hover { color: var(--ink); }
.card { background: var(--card); border-radius: 26px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.tile { border-radius: 26px; padding: 18px; color: var(--on-pastel); display: flex; flex-direction: column; gap: 8px; min-width: 0; text-align: left; }
.pill { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 20px; border-radius: 999px; font-weight: 500; font-size: 15px; white-space: nowrap; }
.pill.dark { background: var(--bar); color: var(--on-bar); }
.pill.sun { background: var(--sun); color: var(--on-pastel); }
.pill.ghost { background: var(--chip); color: var(--ink); }
.pill.block { width: 100%; min-height: 54px; font-size: 16px; font-weight: 600; }
.pill:disabled { opacity: .5; cursor: default; }
.tag { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; background: var(--chip); color: var(--ink); white-space: nowrap; }
.tag.ok { background: var(--sage); color: var(--on-pastel); }
.tag.warn { background: var(--sun); color: var(--on-pastel); }
.tag.bad { background: var(--red); color: #fff; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 38px; padding: 0 14px; border-radius: 999px; background: var(--chip); font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--bar); color: var(--on-bar); }
.seg { display: flex; background: var(--chip); border-radius: 999px; padding: 4px; gap: 4px; }
.seg button { flex: 1; min-height: 38px; border-radius: 999px; font-size: 14px; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .flabel { font-size: 13px; color: var(--muted); }
input, select, textarea {
  font: inherit; color: var(--ink); background: var(--chip); border: 1px solid transparent; border-radius: 16px;
  padding: 12px 14px; min-height: 48px; width: 100%;
}
.sheet input, .sheet select, .sheet textarea { background: var(--card); }
.card input, .card select, .card textarea, .sheet .card input { background: var(--bg); }
input:focus, select:focus, textarea:focus { border-color: var(--ink); outline: none; }
textarea { min-height: 96px; resize: vertical; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.empty { color: var(--muted); font-size: 14px; padding: 6px 0; }

.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.avatar { width: 52px; height: 52px; border-radius: 50%; background: var(--sun); display: grid; place-content: center; font-weight: 700; font-size: 20px; color: var(--on-pastel); flex: none; }
.sync { font-size: 12px; color: var(--muted); }

.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.wd .n { font-size: 13px; color: var(--muted); }
.wd .c { width: 100%; max-width: 48px; aspect-ratio: 1; border-radius: 50%; background: var(--card); display: grid; place-content: center; font-weight: 500; font-size: 16px; position: relative; }
.wd .c::after { content: ""; position: absolute; bottom: 6px; left: 50%; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--dot, transparent); }
.wd.sel .c { background: var(--sun); color: var(--on-pastel); }
.wd.sel .n { color: var(--ink); font-weight: 600; }
.wd:disabled { opacity: .35; cursor: default; }
.weeknav { display: flex; gap: 6px; }
.round { width: 44px; height: 44px; border-radius: 50%; background: var(--card); display: grid; place-content: center; flex: none; }
.round svg { width: 18px; height: 18px; }
.round:disabled { opacity: .35; cursor: default; }

.score { display: grid; place-items: center; position: relative; }
.score svg { width: min(300px, 80vw); height: auto; display: block; }
.score .mid { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 2px; }
.score .big { font-size: 64px; font-weight: 700; line-height: 1; letter-spacing: -0.03em; }
.score .lbl { font-size: 14px; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: center; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }

.goal { background: var(--bar); color: var(--on-bar); border-radius: 26px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
.goal .k { font-size: 12px; opacity: .7; letter-spacing: .08em; text-transform: uppercase; }
.goal p { font-size: 18px; font-weight: 500; line-height: 1.3; }
.goal .chips .tag { background: rgba(255,255,255,.12); color: inherit; }

.dayduo { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 12px; }
.dayduo .tile { min-height: 190px; justify-content: space-between; }
.dayduo h3 { font-size: 20px; }
.dayduo .art { width: 72px; height: 72px; flex: none; }
.status { font-size: 13px; font-weight: 500; }

.group { display: flex; flex-direction: column; gap: 10px; }
.ghead { display: flex; align-items: center; gap: 10px; }
.ghead .sw { width: 12px; height: 12px; border-radius: 50%; }
.ghead .cnt { margin-left: auto; font-size: 13px; color: var(--muted); }
.habit { background: var(--card); border-radius: 22px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.hrow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; }
.check { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-content: center; transition: background .15s, border-color .15s; flex: none; }
.check svg { width: 16px; height: 16px; opacity: 0; transition: opacity .15s; color: var(--on-pastel); }
.habit.done .check, .check.on { background: var(--hc, var(--sun)); border-color: var(--hc, var(--sun)); }
.habit.done .check svg, .check.on svg { opacity: 1; }
.habit.done .hname { color: var(--muted); }
.hname { font-weight: 500; font-size: 16px; }
.hsub { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.more { width: 36px; height: 36px; border-radius: 50%; display: grid; place-content: center; color: var(--muted); }
.more svg { width: 18px; height: 18px; transition: transform .2s; }

.hx { display: flex; flex-direction: column; gap: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.hx .q { font-size: 14px; color: var(--muted); font-style: italic; }
.plan { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.plan div { border-radius: 12px; background: var(--chip); padding: 8px 2px; text-align: center; font-size: 11px; line-height: 1.2; min-width: 0; overflow-wrap: anywhere; }
.plan div b { display: block; font-size: 12px; margin-bottom: 2px; }
.plan div.now { background: var(--sun); color: var(--on-pastel); }
.prog { height: 10px; border-radius: 999px; background: var(--chip); overflow: hidden; }
.prog i { display: block; height: 100%; border-radius: 999px; background: var(--hc, var(--sun)); }
.inline { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: end; }
.habit input { background: var(--bg); }

.bubbles { position: relative; width: 100%; }
.bub { position: absolute; border-radius: 50%; display: grid; place-content: center; text-align: center; color: var(--on-pastel); transition: transform .2s, opacity .2s; padding: 4px; }
.bub:hover { transform: scale(1.04); }
.bub b { font-size: clamp(16px, 4.5vw, 24px); line-height: 1; }
.bub span { font-size: 12px; line-height: 1.1; }
.bub.dim { opacity: .35; }
.gitem { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; padding: 10px 0; border-top: 1px solid var(--line); }
.gitem i { width: 12px; height: 12px; border-radius: 50%; margin-top: 5px; }

.gscroll { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 4px; scrollbar-width: none; }
.gscroll::-webkit-scrollbar { display: none; }
.gcard { flex: 0 0 min(300px, 82%); scroll-snap-align: start; }
.grow { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.gcell { background: rgba(255,255,255,.55); border-radius: 14px; padding: 8px; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.gcell .k { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; opacity: .7; }
.gcell .v { font-weight: 600; font-size: 14px; line-height: 1.15; overflow-wrap: anywhere; }
.gcell .g { font-size: 11px; opacity: .75; overflow-wrap: anywhere; }

.rows { display: flex; flex-direction: column; }
.r { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.r:first-child { border-top: none; }
.r .dot { width: 40px; height: 40px; border-radius: 14px; display: grid; place-content: center; font-weight: 600; font-size: 14px; color: var(--on-pastel); }
.r .t { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.r .t b { font-weight: 500; overflow-wrap: anywhere; }
.r .a { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.r .amt { font-weight: 600; white-space: nowrap; }
.x { width: 32px; height: 32px; border-radius: 50%; color: var(--muted); font-size: 18px; }
.x:hover { background: var(--chip); color: var(--ink); }

.pillbars { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 8px; height: 220px; align-items: end; }
.pb { display: flex; flex-direction: column; align-items: center; gap: 8px; height: 100%; min-width: 0; }
.pb .track { flex: 1; width: 100%; border-radius: 999px; background: var(--chip); display: flex; align-items: flex-end; overflow: hidden; }
.pb .fill { width: 100%; border-radius: 999px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 10px; font-size: 12px; font-weight: 600; color: var(--on-pastel); min-height: 36px; }
.pb .nm { font-size: 11px; color: var(--muted); text-align: center; line-height: 1.15; height: 26px; overflow: hidden; }
.kpi { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi b { font-size: 28px; font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; overflow-wrap: anywhere; }
.bigno { font-size: 48px; font-weight: 700; line-height: 1; letter-spacing: -0.03em; overflow-wrap: anywhere; }

.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal .h { font-size: 12px; color: var(--muted); text-align: center; padding-bottom: 4px; }
.cd { aspect-ratio: 1; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 14px; position: relative; min-width: 0; }
.cd.save { background: color-mix(in srgb, var(--sun) 30%, transparent); }
.cd.today { box-shadow: inset 0 0 0 2px var(--ink); }
.cd.sel { background: var(--bar); color: var(--on-bar); }
.cd .ds { display: flex; gap: 2px; height: 6px; }
.cd .ds i { width: 6px; height: 6px; border-radius: 50%; }
.cd .ds i.paid { opacity: .35; }
.alert { border-radius: 22px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; background: var(--pink); color: var(--on-pastel); }
.alert .r { border-top-color: rgba(0,0,0,.08); }
.alert .muted { color: rgba(31,27,26,.7); }

.path { background: var(--card); border-radius: 22px; overflow: hidden; }
.path > button { width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 16px; text-align: left; }
.path .ix { width: 44px; height: 44px; border-radius: 16px; display: grid; place-content: center; font-weight: 700; color: var(--on-pastel); }
.pd { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 0 16px 16px; }
.pd > div { background: var(--chip); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.rhythm { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.rh { border-radius: 18px; background: var(--card); padding: 10px 2px; text-align: center; display: flex; flex-direction: column; gap: 4px; min-width: 0; font-size: 11px; overflow-wrap: anywhere; hyphens: auto; }
.rh b { font-size: 12px; }
.rh span { font-size: 11px; color: var(--muted); overflow-wrap: anywhere; }
.rh.now { background: var(--sun); color: var(--on-pastel); }
.rh.now span { color: rgba(31,27,26,.75); }
.ms { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; padding: 10px 0; text-align: left; width: 100%; border-top: 1px solid var(--line); }
.ms .check { width: 28px; height: 28px; }
.ms.done > span:last-child { color: var(--muted); text-decoration: line-through; }
.tile .ms.done > span:last-child { color: rgba(31,27,26,.55); }

.ai { background: var(--card); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
.ai .it { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; align-items: start; }
.ai .sc { width: 44px; height: 44px; border-radius: 14px; display: grid; place-content: center; font-weight: 700; font-size: 16px; color: var(--on-pastel); }

.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center;
  padding: 0 max(12px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); pointer-events: none; }
.navbar { pointer-events: auto; width: 100%; max-width: 528px; background: var(--bar); color: var(--on-bar); border-radius: 28px; height: 68px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
.nb { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; opacity: .6; min-height: 52px; justify-content: center; }
.nb svg { width: 22px; height: 22px; }
.nb[aria-current="page"] { opacity: 1; }
.nb[aria-current="page"] svg { color: var(--sun); }
.plus { justify-self: center; width: 60px; height: 60px; border-radius: 50%; background: var(--sun); color: var(--on-pastel); display: grid; place-content: center; margin-top: -30px; box-shadow: 0 6px 16px rgba(247,185,40,.45); }
.plus svg { width: 26px; height: 26px; }

.scrim { position: fixed; inset: 0; z-index: 30; background: rgba(20,16,15,.45); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; background: var(--bg); border-radius: 28px 28px 0 0;
  padding: 10px max(18px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 16px; }
.grab { width: 44px; height: 5px; border-radius: 3px; background: var(--line); align-self: center; flex: none; }
.sheethead { display: flex; justify-content: space-between; align-items: center; gap: 12px; }

.focus { position: fixed; inset: 0; z-index: 40; background: #1F1B1A; color: #F3EFE8; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; text-align: center;
  padding: calc(24px + env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px)); }
.focus .k { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; opacity: .6; }
.focus .task { font-size: clamp(22px, 6vw, 32px); font-weight: 600; max-width: 20ch; overflow-wrap: anywhere; }
.focus .time { font-size: clamp(72px, 22vw, 140px); font-weight: 700; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums; }
.focus .only { font-family: var(--hand); font-size: 30px; color: #F7B928; }
.focus .acts { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.focus .pill.ghost { background: rgba(255,255,255,.1); color: #F3EFE8; }

@media (max-width: 520px) { .rh span { display: none; } }
@media (max-width: 400px) {
  .dayduo { grid-template-columns: 1fr; }
  .dayduo .tile { min-height: 150px; }
  .pd { grid-template-columns: 1fr; }
  .plan div { font-size: 10px; }
  .rh span { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

    if (!ui.editing) return h + "</section>";
    const have = new Set(state.habits.map(x => x.id)), missing = LIBRARY.filter(x => !have.has(x.id));
    h += '<div class="card"><form data-form="addHabit" style="display:flex;flex-direction:column;gap:10px"><div class="field"><label for="nh">Nuevo hábito</label><input id="nh" name="name" maxlength="80" required placeholder="Tomar 2 L de agua"></div><div class="field"><label for="nc">Momento</label><select id="nc" name="cat">' + Object.entries(CATS).map(([k, v]) => '<option value="' + k + '">' + v.n + "</option>").join("") + '</select></div><button class="pill dark" type="submit">Agregar</button></form>' +
      (missing.length ? '<div class="chips">' + missing.map(x => '<button class="chip" data-act="addLib" data-arg="' + x.id + '">+ ' + esc(x.name) + "</button>").join("") + "</div>" : "") +
      '<div class="rows">' + state.habits.map(x => '<div class="r" style="grid-template-columns:minmax(0,1fr) auto"><span>' + esc(x.name) + ' <span class="small muted">· ' + CATS[x.cat].n + "</span></span>" +
        (ui.pendingDelete === x.id ? '<span style="display:flex;gap:6px"><button class="pill ghost" data-act="cancelDel">Cancelar</button><button class="pill dark" data-act="confirmDel" data-arg="' + esc(x.id) + '">Quitar</button></span>' : '<button class="see" data-act="del" data-arg="' + esc(x.id) + '">Quitar</button>') + "</div>").join("") + "</div></div>";
    return h + "</section>";
  }

  // ---------- Finanzas ----------
  function viewFinanzas(dk, isToday) {
    const ym = ymOf(today()), hs = habitsIn(["finanzas"]), done = doneOn(dk), s = state.settings;
    let h = "";
    const ss = saveStatus(ym);
    const rem = [];
    if (ss.k === "soon" || ss.k === "late") rem.push('<div class="r"><span class="dot" style="background:var(--sun)">%</span><div class="t"><b>Págate primero</b><span class="small muted">' + ss.txt + " · " + money(s.save, s.saveCur) + '</span></div><button class="pill dark" data-act="paySave">Hecho</button></div>');
    state.bills.forEach(b => { const st = billStatus(b, ym); if (st.k === "late" || st.k === "soon") rem.push('<div class="r"><span class="dot" style="background:' + b.color + '">' + esc(b.name[0]) + '</span><div class="t"><b>' + esc(b.name) + '</b><span class="small muted">' + st.txt + (b.amt ? " · " + money(b.amt, b.cur) : "") + '</span></div><button class="pill dark" data-act="payBill" data-arg="' + b.id + '">Pagado</button></div>'); });
    if (rem.length) h += '<div class="alert" role="status"><h3>Recordatorios de pago</h3><div class="rows">' + rem.join("") + "</div></div>";

    h += '<section class="card" aria-label="Págate primero"><div class="shead"><h2>Págate primero</h2><span class="tag ' + ss.cls + '">' + ss.txt + "</span></div>" +
      '<span class="bigno num">' + money(s.save, s.saveCur) + '</span><p class="muted">al mes, en la primera semana, antes de pagar cualquier otra cosa. Al año: <b style="color:var(--ink)">' + money(s.save * 12, s.saveCur) + "</b>. Invertido al " + nf(s.rate, 1) + '% anual, en 10 años: <b style="color:var(--ink)">' + money(futureValue(s.save, s.rate, 10), s.saveCur) + "</b>.</p>" +
      projBars(s) +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' + (ss.k === "paid" ? '<button class="pill ghost" data-act="unpaySave">Marcar pendiente</button>' : '<button class="pill sun" data-act="paySave">Ya me pagué este mes</button>') + '<button class="pill ghost" data-act="sheet" data-arg="save">Ajustar monto</button></div></section>';

    h += calendarSection();

    h += '<section aria-label="Recibos"><div class="shead"><h2>Recibos del mes</h2><button class="see" data-act="sheet" data-arg="bill" data-id="">+ Agregar</button></div><div class="card"><div class="rows">' +
      state.bills.map(b => { const st = billStatus(b, ym); return '<div class="r"><span class="dot" style="background:' + b.color + '">' + esc(b.name[0]) + '</span><div class="t"><b>' + esc(b.name) + '</b><span class="small muted">' + (b.day ? "Día " + b.day : "Fecha por confirmar") + (b.amt ? " · " + money(b.amt, b.cur) : "") + '</span></div><div class="a"><span class="tag ' + st.cls + '">' + st.txt + '</span><span style="display:flex;gap:12px">' + (st.k === "paid" ? '<button class="see" data-act="unpayBill" data-arg="' + b.id + '">Deshacer</button>' : (b.day ? '<button class="see" data-act="payBill" data-arg="' + b.id + '">Pagar</button>' : "")) + '<button class="see" data-act="sheet" data-arg="bill" data-id="' + b.id + '">Editar</button></span></div></div>'; }).join("") +
      '</div><p class="small muted">Agrega el día de pago y el valor de cada recibo para verlo en el calendario y en los recordatorios.</p></div></section>';

    const todays = state.expenses.filter(e => e.d === dk);
    h += '<section aria-label="Gastos del día"><div class="shead"><h2>Gastos ' + (isToday ? "de hoy" : "del día") + '</h2><button class="see" data-act="tab" data-arg="gastos">Ver todo</button></div><div class="card"><div style="display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap"><span class="kpi"><span class="small muted">Total</span><b class="num">' + curTotals(todays) + '</b></span><button class="pill sun" data-act="sheet" data-arg="expense">+ Agregar gasto</button></div>' + expenseRows(todays.slice(-4)) + "</div></section>";

    h += '<section class="group"><div class="ghead"><span class="sw" style="background:var(--sage)"></span><h2>Hábitos de dinero</h2><span class="cnt num">' + hs.filter(x => done.has(x.id)).length + " / " + hs.length + "</span></div>";
    hs.forEach(x => { h += habitCard(x, dk, done); });
    h += "</section>";
    h += goalsSection(["finanzas"]);
    return h;
  }

  function projBars(s) {
    const rows = [1, 5, 10, 20].map(y => ({ y, dep: s.save * 12 * y, fv: futureValue(s.save, s.rate, y) }));
    const max = Math.max(...rows.map(r => r.fv), 1);
    return '<div class="pillbars" style="height:200px" role="img" aria-label="Proyección del ahorro invertido a 1, 5, 10 y 20 años">' + rows.map(r => {
      const dp = r.fv ? (r.dep / r.fv * 100).toFixed(0) : 100;
      return '<div class="pb"><span class="small num" style="font-weight:600">' + money(r.fv, s.saveCur, true) + '</span><div class="track"><div class="fill" style="height:' + Math.max(18, r.fv / max * 100) + "%;background:linear-gradient(to top, var(--sun) " + dp + "%, var(--earth) " + dp + '%)"></div></div><span class="nm">' + r.y + (r.y === 1 ? " año" : " años") + "</span></div>"; }).join("") +
      '</div><div class="legend" style="justify-content:flex-start"><span><i style="background:var(--sun)"></i>Lo que aportas</span><span><i style="background:var(--earth)"></i>Interés compuesto</span></div>';
  }

  function calendarSection() {
    const [y, m] = ui.calYM.split("-").map(Number), n = dim(y, m - 1), t = today();
    const lead = (new Date(y, m - 1, 1).getDay() + 6) % 7;
    let h = '<section aria-label="Calendario de pagos"><div class="shead"><h2>Calendario</h2><div class="weeknav"><button class="round" data-act="calPrev" aria-label="Mes anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button><button class="round" data-act="calNext" aria-label="Mes siguiente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button></div></div>' +
      '<div class="card"><h3>' + MONTHS[m - 1].replace(/^./, c => c.toUpperCase()) + " " + y + '</h3><div class="cal">' + ["L", "M", "M", "J", "V", "S", "D"].map(d => '<span class="h">' + d + "</span>").join("");
    for (let i = 0; i < lead; i++) h += "<span></span>";
    const paid = state.paid[ui.calYM] || {};
    for (let d = 1; d <= n; d++) {
      const k = y + "-" + pad(m) + "-" + pad(d);
      const bills = state.bills.filter(b => b.day && Math.min(b.day, n) === d);
      h += '<button class="cd' + (d <= 7 ? " save" : "") + (k === keyOf(t) ? " today" : "") + (ui.calDay === k ? " sel" : "") + '" data-act="calDay" data-arg="' + k + '" aria-label="' + d + " de " + MONTHS[m - 1] + (bills.length ? ", " + bills.map(b => b.name).join(", ") : "") + (d <= 7 ? ", semana de págate primero" : "") + '"><span class="num">' + d + '</span><span class="ds">' + bills.map(b => '<i class="' + (paid[b.id] ? "paid" : "") + '" style="background:' + b.color + '"></i>').join("") + "</span></button>";
    }
    h += '</div><div class="legend" style="justify-content:flex-start"><span><i style="background:color-mix(in srgb, var(--sun) 45%, transparent)"></i>Semana de págate primero</span><span><i style="background:var(--earth)"></i>Día de pago</span></div>';
    if (ui.calDay) {
      const dd = parseKey(ui.calDay), bills = state.bills.filter(b => b.day && Math.min(b.day, n) === dd.getDate());
      const lines = bills.map(b => { const st = billStatus(b, ui.calYM); return '<div class="r"><span class="dot" style="background:' + b.color + '">' + esc(b.name[0]) + '</span><div class="t"><b>' + esc(b.name) + '</b><span class="small muted">' + (b.amt ? money(b.amt, b.cur) : "Valor por confirmar") + '</span></div><span class="tag ' + st.cls + '">' + st.txt + "</span></div>"; });
      if (dd.getDate() <= 7) { const ss = saveStatus(ui.calYM); lines.unshift('<div class="r"><span class="dot" style="background:var(--sun)">%</span><div class="t"><b>Págate primero</b><span class="small muted">' + money(state.settings.save, state.settings.saveCur) + '</span></div><span class="tag ' + ss.cls + '">' + ss.txt + "</span></div>"); }
      h += '<div class="rows">' + (lines.join("") || '<p class="empty">Sin pagos el ' + dd.getDate() + " de " + MONTHS[dd.getMonth()] + ".</p>") + "</div>";
    }
    return h + "</div></section>";
  }

  function expenseRows(items) {
    if (!items.length) return '<p class="empty">Nada registrado todavía.</p>';
    return '<div class="rows">' + items.map(e => { const ci = EXP_CATS.indexOf(e.cat); return '<div class="r"><span class="dot" style="background:' + EXP_COLORS[ci < 0 ? 10 : ci] + '">' + esc(e.cat[0]) + '</span><div class="t"><b>' + esc(e.note || e.cat) + '</b><span class="small muted">' + esc(e.note ? e.cat + " · " : "") + (e.kind === "want" ? "Deseo" : "Necesidad") + '</span></div><div class="a"><span class="amt num">' + money(e.amt, e.cur) + '</span><button class="x" data-act="delExp" data-arg="' + esc(e.id) + '" aria-label="Borrar ' + esc(e.note || e.cat) + '">×</button></div></div>'; }).join("") + "</div>";
  }

  // ---------- Gastos ----------
  function viewGastos(dk, isToday) {
    const items = state.expenses.filter(e => e.d === dk);
    const y = selected.getFullYear(), m = selected.getMonth(), ym = ymOf(selected), t = today(), cur = ui.monthCur;
    const monthItems = state.expenses.filter(e => e.d.startsWith(ym) && e.cur === cur);
    const total = sum(monthItems);
    const elapsed = (y === t.getFullYear() && m === t.getMonth()) ? t.getDate() : dim(y, m);
    const need = sum(monthItems.filter(e => e.kind === "need")), want = total - need;
    const byCat = {}; monthItems.forEach(e => { byCat[e.cat] = (byCat[e.cat] || 0) + e.amt; });
    const rows = Object.entries(byCat).sort((a, b) => b[1] - a[1]).slice(0, 5);
    const ledgerDone = doneOn(dk).has("ledger");
    let h = '<section aria-label="Gastos del día"><div class="shead"><h2>Gastos ' + (isToday ? "de hoy" : "del día") + "</h2>" + (!items.length && !ledgerDone ? '<button class="see" data-act="noSpend">' + (isToday ? "Hoy no gasté nada" : "Ese día no gasté") + "</button>" : "") + "</div>" +
      '<div class="card"><span class="kpi"><span class="small muted">Total del día</span><b class="num">' + curTotals(items) + "</b></span>" +
      (items.length ? expenseRows(items) : '<p class="empty">' + (ledgerDone ? "Día sin gastos. Bien hecho." : "Toca + para registrar tu primer gasto del día.") + "</p>") +
      '<button class="pill sun block" data-act="sheet" data-arg="expense">Agregar gasto</button></div></section>';
    h += '<section aria-label="Resumen del mes"><div class="shead"><h2>' + MONTHS[m].replace(/^./, c => c.toUpperCase()) + " " + y + "</h2></div>" +
      '<div class="seg" role="group" aria-label="Moneda del resumen"><button data-act="monthCur" data-arg="COP" aria-pressed="' + (cur === "COP") + '">Pesos (COP)</button><button data-act="monthCur" data-arg="USD" aria-pressed="' + (cur === "USD") + '">Dólares (USD)</button></div>' +
      '<div class="card" style="align-items:center;text-align:center"><span class="bigno num">' + money(total, cur) + '</span><p class="muted">gastado este mes · ' + money(total / Math.max(1, elapsed), cur) + " al día en promedio</p>" +
      '<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><span class="tag" style="background:var(--sky);color:var(--on-pastel)">Necesidades ' + (total ? Math.round(need / total * 100) : 0) + '%</span><span class="tag" style="background:var(--pink);color:var(--on-pastel)">Deseos ' + (total ? Math.round(want / total * 100) : 0) + "%</span></div></div>";
    h += '<div class="card"><h3>¿En qué se va?</h3><p class="small muted">Tus categorías con más gasto este mes</p>';
    if (rows.length) {
      const max = rows[0][1];
      h += '<div class="pillbars">' + rows.map(([c, v]) => { const ci = EXP_CATS.indexOf(c); return '<div class="pb"><div class="track"><div class="fill" style="height:' + Math.max(16, v / max * 100) + "%;background:" + EXP_COLORS[ci < 0 ? 10 : ci] + '">' + Math.round(v / total * 100) + '%</div></div><span class="nm">' + esc(c) + "</span></div>"; }).join("") + "</div>";
      h += '<div class="rows">' + rows.map(([c, v]) => '<div class="r" style="grid-template-columns:minmax(0,1fr) auto"><span>' + esc(c) + '</span><span class="amt num">' + money(v, cur) + "</span></div>").join("") + "</div>";
    } else h += '<p class="empty">Sin gastos en ' + (cur === "COP" ? "pesos" : "dólares") + " este mes.</p>";
    return h + "</div></section>";
  }

  // ---------- Crecer ----------
  function viewCrecer(dk, isToday) {
    const sd = state.side, s = state.settings, t = today();
    let h = "";
    if (ui.editGoal) {
      h += '<section class="card"><h2>Tu súper meta</h2><form data-form="goal" style="display:flex;flex-direction:column;gap:12px"><div class="field"><label for="gl">Súper meta</label><textarea id="gl" name="goal" maxlength="300" required>' + esc(s.goal) + '</textarea></div><div class="field"><label for="pl">Pilares, separados por coma</label><input id="pl" name="pillars" maxlength="120" value="' + esc(s.pillars.join(", ")) + '"></div><button class="pill dark" type="submit">Guardar</button></form></section>';
    } else {
      h += '<div class="goal"><span class="k">Súper meta</span><p style="font-size:22px">' + esc(s.goal) + '</p><div class="chips">' + s.pillars.map(p => '<span class="tag">' + esc(p) + "</span>").join("") + '</div><button class="see" style="color:inherit;opacity:.75;text-align:left" data-act="editGoal">Editar súper meta</button></div>';
    }
    const counts = Object.fromEntries(s.pillars.map(p => [p, 0]));
    for (let i = 0; i < 30; i++) { const d = peekDay(keyOf(addDays(t, -i))); if (d) d.pri.forEach(p => { if (p.t.trim() && p.done && counts[p.pil] != null) counts[p.pil]++; }); }
    const maxC = Math.max(1, ...Object.values(counts));
    const pcol = ["var(--sun)", "var(--cocoa)", "var(--sage)", "var(--sky)", "var(--lav)"];
    h += '<section class="card" aria-label="Pilares"><h2>Tus pilares</h2><p class="small muted">Prioridades cumplidas por pilar en los últimos 30 días. Se llenan cuando asignas un pilar a cada prioridad y la marcas al cerrar el día.</p><div class="pillbars" style="height:200px">' +
      s.pillars.map((p, i) => '<div class="pb"><div class="track"><div class="fill" style="height:' + (counts[p] ? Math.max(16, counts[p] / maxC * 100) : 14) + "%;opacity:" + (counts[p] ? 1 : .35) + ";background:" + pcol[i % 5] + (i % 5 === 1 ? ";color:#F8F4EA" : "") + '">' + counts[p] + '</div></div><span class="nm">' + esc(p) + "</span></div>").join("") + "</div></section>";

    h += '<section aria-label="Ingreso extra"><div class="shead"><h2>Ingreso extra</h2><span class="see">30 min al día</span></div><p class="muted">Treinta minutos diarios son 182 horas al año. Elige un solo camino, dale a cada día una tarea y mide.</p>';
    PATHS.forEach((p, i) => {
      const on = sd.path === p.id, open = ui.openPath === p.id;
      h += '<div class="path"><button data-act="path" data-arg="' + p.id + '" aria-expanded="' + open + '"><span class="ix num" style="background:' + p.c + '">' + (i + 1) + '</span><span style="min-width:0"><b style="font-weight:600">' + esc(p.t) + '</b><span class="small muted" style="display:block">' + esc(p.l) + "</span></span>" + (on ? '<span class="tag ok">Tu camino</span>' : '<span class="more" aria-hidden="true">' + CHEV + "</span>") + "</button>" +
        (open ? '<div class="pd"><div><b>Primer paso</b>' + esc(p.start) + "</div><div><b>Cómo cobrar</b>" + esc(p.price) + "</div><div><b>Dónde</b>" + esc(p.where) + "</div><div><b>Por qué funciona</b>" + esc(p.tip) + '</div><div style="grid-column:1/-1;background:none;padding:0">' + (on ? '<button class="pill ghost" data-act="choose" data-arg="">Cambiar de camino</button>' : '<button class="pill dark" data-act="choose" data-arg="' + p.id + '">Elegir este camino</button>') + "</div></div>" : "") + "</div>";
    });
    h += "</section>";
    const dow = t.getDay();
    h += '<section aria-label="Ritmo"><h2>Tus 30 minutos, día a día</h2><div class="rhythm">' + RHYTHM.map(([d, v, x]) => '<div class="rh' + (d === dow ? " now" : "") + '"><b>' + DOW[d] + "</b>" + v + "<span>" + x + "</span></div>").join("") + "</div></section>";
    let tot = 0, dn = 0;
    const ph = PHASES.map((p, i) => { tot += p.ms.length; const d = p.ms.filter(m => sd.milestones[m[0]]).length; dn += d;
      return '<div class="tile" style="background:' + ["var(--sun)", "var(--peach)", "var(--sage)"][i] + '"><div class="shead"><h3>' + p.h + '</h3><span class="small num">' + p.t + " · " + d + "/" + p.ms.length + "</span></div>" +
        p.ms.map(m => { const on = !!sd.milestones[m[0]]; return '<button class="ms' + (on ? " done" : "") + '" style="border-top-color:rgba(0,0,0,.08)" data-act="ms" data-arg="' + m[0] + '" role="checkbox" aria-checked="' + on + '"><span class="check' + (on ? " on" : "") + '" style="--hc:#1F1B1A;border-color:rgba(0,0,0,.25)"><svg viewBox="0 0 16 16" fill="none" stroke="#F3EFE8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3L12.5 5"/></svg></span><span>' + esc(m[1]) + "</span></button>"; }).join("") + "</div>"; }).join("");
    h += '<section aria-label="Ruta de 90 días"><div class="shead"><h2>Ruta de 90 días</h2><span class="see num">' + dn + " / " + tot + "</span></div>" + ph + "</section>";
    h += '<section class="card" aria-label="Bitácora"><div class="shead"><h2>Bitácora</h2><span class="see">' + (isToday ? "Hoy" : selected.getDate() + " " + MONTHS[selected.getMonth()].slice(0, 3)) + '</span></div><div class="field"><label for="sessNote">¿Qué hiciste en tus 30 minutos?</label><textarea id="sessNote" data-bind="sessNote" maxlength="500" placeholder="Fotografié 4 láminas y escribí la descripción de la tienda.">' + esc(sd.notes[dk] || "") + '</textarea></div><span class="small muted" id="sessSaved"></span>' +
      '<div class="rows">' + Object.entries(sd.notes).filter(([k]) => k !== dk).sort((a, b) => b[0] < a[0] ? -1 : 1).slice(0, 5).map(([k, v]) => { const d = parseKey(k); return '<div class="r" style="grid-template-columns:56px minmax(0,1fr)"><span class="small muted">' + d.getDate() + " " + MONTHS[d.getMonth()].slice(0, 3) + "</span><span>" + esc(v) + "</span></div>"; }).join("") + "</div></section>";
    const ym = ymOf(t);
    h += '<section class="card" aria-label="Ingresos"><h2>Lo que ya generó</h2><div class="grid2"><span class="kpi"><span class="small muted">Este mes</span><b class="num">' + curTotals(sd.income.filter(e => e.d.startsWith(ym))) + '</b></span><span class="kpi"><span class="small muted">Total · ' + sd.income.length + (sd.income.length === 1 ? " venta" : " ventas") + '</span><b class="num">' + curTotals(sd.income) + "</b></span></div>" +
      '<form data-form="income" style="display:flex;flex-direction:column;gap:10px"><div class="seg" role="group" aria-label="Moneda"><button type="button" data-act="incCur" data-arg="COP" aria-pressed="' + (ui.incCur === "COP") + '">COP</button><button type="button" data-act="incCur" data-arg="USD" aria-pressed="' + (ui.incCur === "USD") + '">USD</button></div><div class="grid2"><div class="field"><label for="ia">Monto</label><input id="ia" name="amt" type="number" min="0" step="any" inputmode="decimal" required placeholder="0"></div><div class="field"><label for="inn">Qué vendiste</label><input id="inn" name="note" maxlength="80" placeholder="Lámina A4"></div></div><button class="pill dark" type="submit">Registrar ingreso</button></form>' +
      (sd.income.length ? '<div class="rows">' + [...sd.income].sort((a, b) => b.d < a.d ? -1 : 1).slice(0, 8).map(e => { const d = parseKey(e.d); return '<div class="r"><span class="dot" style="background:var(--sage)">$</span><div class="t"><b>' + esc(e.note || "Venta") + '</b><span class="small muted">' + d.getDate() + " de " + MONTHS[d.getMonth()] + '</span></div><div class="a"><span class="amt num">' + money(e.amt, e.cur) + '</span><button class="x" data-act="delInc" data-arg="' + esc(e.id) + '" aria-label="Borrar ingreso">×</button></div></div>'; }).join("") + "</div>"
        : '<p class="hand" style="font-size:28px;color:var(--earth)">tu primera venta irá aquí</p>') + "</section>";
    return h;
  }

  // =============== Sheets ===============

  async function runAI(kind) {
    const dk = keyOf(selected), day = dayOf(dk), s = state.settings;
    if (ui.sample === undefined) { ui.aiErr = "Conectando… intenta de nuevo en un momento."; renderSheet(); return; }
    if (!ui.sample) { ui.aiErr = "El test automático solo funciona al abrir esta página dentro de Claude."; renderSheet(); return; }
    ui.ai[kind] = true; ui.aiErr = ""; renderSheet();
    try {
      if (kind === "open") {
        const pris = day.pri.map((p, i) => (i + 1) + ") " + (p.t.trim() || "(vacía)") + (p.pil ? " [pilar elegido: " + p.pil + "]" : "")).join("\n");
        const prompt = "Eres una coach de emprendimiento directa y cálida. Escribe en español.\n\nSúper meta de Paola: \"" + s.goal + "\"\nPilares: " + s.pillars.join(", ") + "\nContexto: trabaja en su empresa actual, Melt, y construye un ingreso extra con su arte.\nIntención del día: " + (day.intention || "(sin intención)") +
          "\nSus 3 prioridades de hoy:\n" + pris +
          "\n\nEvalúa cada prioridad: qué tanto la acerca a su súper meta (score entero de 0 a 10), a qué pilar aporta (uno de: " + s.pillars.join(", ") + ", Ninguno) y una nota concreta de máximo 22 palabras para que aporte más o sea más medible. Luego un resumen de una frase: ¿estas prioridades la acercan a su súper meta? Si alguna puntúa menos de 5, propone una alternativa concreta en \"alternativa\"; si no, deja \"alternativa\" vacía.\n\nResponde SOLO con JSON válido: {\"items\":[{\"score\":0,\"pilar\":\"\",\"nota\":\"\"}],\"resumen\":\"\",\"alternativa\":\"\"} con un item por prioridad, en orden.";
        const r = await ui.sample.json(prompt, { modelTier: "default" });
        if (!r || !Array.isArray(r.items)) throw { code: "bad" };
        day.aiOpen = { items: r.items.slice(0, 3).map(it => ({ score: Math.max(0, Math.min(10, Math.round(+it.score || 0))), pilar: str(it.pilar, 30), nota: str(it.nota, 200) })), resumen: str(r.resumen, 300), alternativa: str(r.alternativa, 300) };
        day.aiOpen.items.forEach((it, i) => { if (day.pri[i] && !day.pri[i].pil && s.pillars.concat(["Ninguno"]).includes(it.pilar)) day.pri[i].pil = it.pilar; });
      } else {
        const st = day.pri.map((p, i) => p.t.trim() ? (i + 1) + ") " + p.t + " — " + (p.done ? "cumplida" : "no cumplida") : "").filter(Boolean).join("\n") || "(sin prioridades)";
        const prompt = "Eres una coach de emprendimiento directa y cálida. Escribe en español.\n\nSúper meta de Paola: \"" + s.goal + "\"\nPilares: " + s.pillars.join(", ") + "\nPrioridades de hoy y resultado:\n" + st + "\nLo que dice que la acercó hoy: " + (day.win || "(nada escrito)") + "\nNota que se puso: " + day.score + "/10\n\nDale una lectura breve del día (máximo 45 palabras): qué tanto avanzó hacia la súper meta y un patrón que notes. Luego una sugerencia concreta para la prioridad número 1 de mañana (máximo 25 palabras).\n\nResponde SOLO con JSON válido: {\"lectura\":\"\",\"manana\":\"\"}";
        const r = await ui.sample.json(prompt, { modelTier: "default" });
        if (!r || (!r.lectura && !r.manana)) throw { code: "bad" };
        day.aiClose = { lectura: str(r.lectura, 400), manana: str(r.manana, 300) };
      }
      persist();
    } catch (e) {
      ui.aiErr = e && e.code === "not_granted" ? "El permiso para consultar a Claude está desactivado. Puedes activarlo en los permisos de la página." :
        e && e.code === "rate_limited" ? "Demasiadas consultas seguidas. Intenta en un minuto." : "No pude completar el test. Intenta de nuevo.";
    }
    ui.ai[kind] = false;
    if (ui.sheet) renderSheet();
  }

  // =============== Focus timer ===============
  function renderFocus() {
    const r = state.focus.running;
    $("focus").hidden = !r;
    if (!r) return;
    const left = Math.max(0, r.start + r.mins * 60000 - Date.now());
    $("fTask").textContent = r.task || "Melt";
    $("fTime").textContent = pad(Math.floor(left / 60000)) + ":" + pad(Math.floor(left / 1000) % 60);
    if (left <= 0) finishFocus(r.mins);
  }
  function finishFocus(mins) {
    const r = state.focus.running; if (!r) return;
    const d = keyOf(new Date(r.start)), m = Math.round(mins);
    if (m >= 1) state.focus.sessions.push({ d, mins: m, task: r.task });
    state.focus.running = null;
    if (focusMins(d) >= 90) setDone("deep", d, true);
    releaseWake(); persist(); render();
  }
  let wake = null;
  async function holdWake() { try { if (navigator.wakeLock) wake = await navigator.wakeLock.request("screen"); } catch (e) { wake = null; } }
  function releaseWake() { try { if (wake) wake.release(); } catch (e) {} wake = null; }
  setInterval(() => { if (state.focus.running) renderFocus(); }, 1000);

  function setTab(t) { tab = t; ui.editing = false; ui.editGoal = false; try { history.replaceState(null, "", "#" + t); } catch (e) {} render(); window.scrollTo(0, 0); }

  document.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.tab) { setTab(b.dataset.tab); return; }
    const act = b.dataset.act, arg = b.dataset.arg, dk = keyOf(selected);
    if (!act) return;
    switch (act) {
      case "tab": if (ui.sheet) { ui.sheet = null; $("scrim").hidden = true; } setTab(arg); return;
      case "day": selected = parseKey(arg); break;
      case "prevWeek": selected = addDays(selected, -7); break;
      case "nextWeek": selected = addDays(selected, 7); if (selected > today()) selected = today(); break;
      case "toggle": setDone(arg, dk, !doneOn(dk).has(arg)); persist(); render(); { const f = document.querySelector('[data-act="toggle"][data-arg="' + CSS.escape(arg) + '"]'); if (f) f.focus(); } return;
      case "expand": ui.open.has(arg) ? ui.open.delete(arg) : ui.open.add(arg); break;
      case "sheet": openSheet(arg, b.dataset.id !== undefined ? b.dataset.id : null); return;
      case "closeSheet": closeSheet(); return;
      case "pil": { const day = dayOf(dk); day.pri[+arg].pil = day.pri[+arg].pil === b.dataset.id ? "" : b.dataset.id; persist(); renderSheet(); return; }
      case "aiOpen": runAI("open"); return;
      case "aiClose": runAI("close"); return;
      case "saveOpen": { const day = dayOf(dk); if (day.pri.filter(p => p.t.trim()).length === 3) setDone("top3", dk, true); persist(); closeSheet(); return; }
      case "priDone": { const day = dayOf(dk); day.pri[+arg].done = !day.pri[+arg].done; persist(); renderSheet(); return; }
      case "saveClose": { const day = dayOf(dk); day.closed = true; setDone("review", dk, true); persist(); closeSheet(); return; }
      case "focusLen": ui.focusLen = +arg; renderSheet(); return;
      case "focusStop": { const r = state.focus.running; if (r) finishFocus((Date.now() - r.start) / 60000); return; }
      case "focusCancel": state.focus.running = null; releaseWake(); persist(); render(); return;
      case "expCur": ui.expCur = arg; renderSheet(); return;
      case "expCat": ui.expCat = arg; renderSheet(); return;
      case "expKind": ui.expKind = arg; renderSheet(); return;
      case "delExp": state.expenses = state.expenses.filter(x => x.id !== arg); persist(); refresh(); return;
      case "noSpend": setDone("ledger", dk, true); persist(); break;
      case "monthCur": ui.monthCur = arg; break;
      case "paySave": { const ym = ymOf(today()); (state.paid[ym] = state.paid[ym] || {}).save = keyOf(today()); persist(); break; }
      case "unpaySave": { const ym = ymOf(today()); if (state.paid[ym]) delete state.paid[ym].save; persist(); break; }
      case "payBill": { const ym = ymOf(today()); (state.paid[ym] = state.paid[ym] || {})[arg] = keyOf(today()); persist(); break; }
      case "unpayBill": { const ym = ymOf(today()); if (state.paid[ym]) delete state.paid[ym][arg]; persist(); break; }
      case "delBill": state.bills = state.bills.filter(x => x.id !== arg); persist(); closeSheet(); return;
      case "calPrev": case "calNext": { const [y, m] = ui.calYM.split("-").map(Number); ui.calYM = ymOf(new Date(y, m - 1 + (act === "calNext" ? 1 : -1), 1)); ui.calDay = null; break; }
      case "calDay": ui.calDay = ui.calDay === arg ? null : arg; break;
      case "finishBook": { const bk = curBook(); if (bk) { bk.page = bk.total; bk.done = true; } persist(); refresh(); return; }
      case "gratCat": ui.gratCat = arg; renderSheet(); return;
      case "gratRange": ui.gratRange = arg; ui.gratFilter = null; break;
      case "gratFilter": ui.gratFilter = ui.gratFilter === arg ? null : arg; break;
      case "delGrat": state.grat = state.grat.filter(g => g.id !== arg); if (state.grat.filter(g => g.d === dk).length < 3) setDone("journal", dk, false); persist(); refresh(); return;
      case "path": ui.openPath = ui.openPath === arg ? null : arg; break;
      case "choose": state.side.path = arg || null; if (arg) state.side.milestones.p1 = true; persist(); break;
      case "ms": { const m = state.side.milestones; if (m[arg]) delete m[arg]; else m[arg] = true; persist(); break; }
      case "incCur": ui.incCur = arg; break;
      case "delInc": state.side.income = state.side.income.filter(x => x.id !== arg); persist(); break;
      case "editGoal": ui.editGoal = true; break;
      case "editToggle": ui.editing = !ui.editing; ui.pendingDelete = null; break;
      case "addLib": { const x = LIB[arg]; if (x) state.habits.push(fromLib(x)); persist(); break; }
      case "del": ui.pendingDelete = arg; break;
      case "cancelDel": ui.pendingDelete = null; break;
      case "confirmDel": state.habits = state.habits.filter(x => x.id !== arg); ui.pendingDelete = null; persist(); break;
      default: return;
    }
    render();
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && ui.sheet) closeSheet(); });

  let bindTimer = null;
  document.addEventListener("input", e => {
    const key = e.target.dataset && e.target.dataset.bind;
    if (!key) return;
    const dk = keyOf(selected), v = e.target.value;
    if (key === "sessNote") {
      if (v.trim()) { state.side.notes[dk] = v.slice(0, 500); setDone("side", dk, true); } else delete state.side.notes[dk];
      const el = $("sessSaved"); if (el) el.textContent = "Guardando…";
      clearTimeout(bindTimer);
      bindTimer = setTimeout(() => { persist(); const el2 = $("sessSaved"); if (el2) el2.textContent = v.trim() ? "Guardado. Sesión marcada como hecha." : ""; }, 500);
      return;
    }
    const day = dayOf(dk);
    if (key.startsWith("pri:")) day.pri[+key.slice(4)].t = v.slice(0, 140);
    else if (key === "intention") day.intention = v.slice(0, 200);
    else if (key === "win") day.win = v.slice(0, 400);
    else if (key === "score") { day.score = +v; const o = $("scv"); if (o) o.textContent = v; }
    clearTimeout(bindTimer); bindTimer = setTimeout(persist, 500);
    if (key.startsWith("pri:")) { const btn = document.querySelector('[data-act="aiOpen"]'); if (btn && !ui.ai.open) btn.disabled = !day.pri.some(p => p.t.trim()); }
  });

  document.addEventListener("submit", e => {
    const f = e.target, kind = f.dataset && f.dataset.form;
    if (!kind) return;
    e.preventDefault();
    const fd = new FormData(f), dk = keyOf(selected);
    const num = n => { const x = parseFloat(fd.get(n)); return Number.isFinite(x) ? x : null; };
    const txt = (n, l) => String(fd.get(n) || "").trim().slice(0, l);
    if (kind === "expense") {
      const amt = num("amt"); if (!amt || amt <= 0) return;
      state.expenses.push({ id: uid(), d: dk, amt, cur: ui.expCur, cat: ui.expCat, kind: ui.expKind, note: txt("note", 80) });
      setDone("ledger", dk, true); persist(); render(); renderSheet();
      const a = $("ea"); if (a) a.focus();
    } else if (kind === "focus") {
      state.focus.running = { start: Date.now(), mins: ui.focusLen, task: txt("task", 120) };
      persist(); ui.sheet = null; $("scrim").hidden = true; holdWake(); render();
    } else if (kind === "bill") {
      const name = txt("name", 40); if (!name) return;
      const day = num("day"), amt = num("amt"), cur = fd.get("cur") === "USD" ? "USD" : "COP";
      let b = state.bills.find(x => x.id === ui.arg);
      if (!b) { b = { id: "b" + uid(), name, color: EXP_COLORS[state.bills.length % EXP_COLORS.length] }; state.bills.push(b); }
      Object.assign(b, { name, day: day && day >= 1 && day <= 31 ? Math.round(day) : null, amt: amt != null && amt >= 0 ? amt : null, cur });
      persist(); closeSheet();
    } else if (kind === "save") {
      const v = num("save"), r = num("rate");
      if (v != null && v >= 0) state.settings.save = v;
      if (r != null && r >= 0 && r <= 30) state.settings.rate = r;
      state.settings.saveCur = fd.get("cur") === "USD" ? "USD" : "COP";
      persist(); closeSheet();
    } else if (kind === "book") {
      const total = Math.round(num("total") || 0); if (total < 1) return;
      state.books.forEach(x => { x.done = true; });
      state.books.push({ id: "k" + uid(), title: txt("title", 120) || "Libro", total, page: Math.max(0, Math.min(total, Math.round(num("page") || 0))), done: false });
      persist(); closeSheet();
    } else if (kind === "bookPage") {
      const bk = curBook(); if (!bk) return;
      const p = Math.max(0, Math.min(bk.total, Math.round(num("page") || 0)));
      if (p > bk.page) { state.reading[dk] = (state.reading[dk] || 0) + (p - bk.page); setDone("read", dk, true); }
      bk.page = p; persist(); closeSheet();
    } else if (kind === "pages") {
      const bk = curBook(), n = Math.round(num("pages") || 0); if (!bk || n < 1) return;
      state.reading[dk] = (state.reading[dk] || 0) + n;
      bk.page = Math.min(bk.total, bk.page + n);
      if (bk.page >= bk.total) bk.done = true;
      setDone("read", dk, true); persist(); render();
    } else if (kind === "learn") {
      const topic = txt("topic", 120); if (!topic) return;
      state.learn[dk] = { topic, what: txt("what", 600) };
      setDone("learn", dk, true); persist(); closeSheet();
    } else if (kind === "grat") {
      const text = txt("text", 200); if (!text) return;
      state.grat.push({ id: "g" + uid(), d: dk, cat: ui.gratCat, text });
      if (state.grat.filter(g => g.d === dk).length >= 3) setDone("journal", dk, true);
      persist(); refresh(); const i = $("gt"); if (i) i.focus();
    } else if (kind === "income") {
      const amt = num("amt"); if (!amt || amt <= 0) return;
      state.side.income.push({ id: uid(), d: dk, amt, cur: ui.incCur, note: txt("note", 80) });
      persist(); render();
    } else if (kind === "goal") {
      const g = txt("goal", 300);
      const p = String(fd.get("pillars") || "").split(",").map(x => x.trim().slice(0, 30)).filter(Boolean).slice(0, 5);
      if (g) state.settings.goal = g;
      if (p.length) state.settings.pillars = p;
      ui.editGoal = false; persist(); render();
    } else if (kind === "addHabit") {
      const name = txt("name", 80); if (!name) return;
      state.habits.push({ id: "c" + uid(), name, cat: CATS[fd.get("cat")] ? fd.get("cat") : "dia" });
      persist(); render();
    }
  });

  window.addEventListener("hashchange", () => { const t2 = hashTab(); if (t2 !== tab) { tab = t2; render(); } });
  let lastDay = keyOf(today());
  setInterval(() => { const k = keyOf(today()); if (k !== lastDay) { if (keyOf(selected) === lastDay) selected = today(); lastDay = k; render(); } }, 60000);

  render();
})();
</script>
